services:
  backend:
    build: ./backend
    container_name: chess_backend
    env_file:
      - .env
    environment:
      - HF_HOME=/models
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    volumes:
      - ./backend/app:/code/app
      - hf-cache:/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload

    depends_on:
      - mongo
    
  ollama-tunnel:
    build: ./backend/ssh-tunnel
    restart: unless-stopped

    volumes:
      - type: bind
        source: "${SSH_DIR}/id_ed25519_ollama"
        target: /run/ssh-input/id_ed25519_ollama
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: "${SSH_DIR}/known_hosts"
        target: /run/ssh-input/known_hosts
        read_only: true
        bind:
          create_host_path: false

    tmpfs:
      - /root/.ssh:mode=0700

    command:
      - "-N"
      - "-T"
      - "-i"
      - "/root/.ssh/id_ed25519_ollama"
      - "-o"
      - "IdentitiesOnly=yes"
      - "-o"
      - "BatchMode=yes"
      - "-o"
      - "StrictHostKeyChecking=yes"
      - "-o"
      - "UserKnownHostsFile=/root/.ssh/known_hosts"
      - "-o"
      - "ExitOnForwardFailure=yes"
      - "-o"
      - "ConnectTimeout=10"
      - "-o"
      - "ServerAliveInterval=30"
      - "-o"
      - "ServerAliveCountMax=3"
      - "-L"
      - "0.0.0.0:11434:127.0.0.1:11434"
      - "admin@192.168.2.190"


  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: quay.io/minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
  
  mongo:
    image: mongo:7
    container_name: chess_mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017" 
  
  frontend:
    build: ./frontend
    container_name: chess_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  hf-cache:
  etcd-data:
  minio-data:
  milvus-data:
  mongo-data: